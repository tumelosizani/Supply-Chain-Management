services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host 6000 -> container 5432, matching spring.datasource.url in application.yaml
      - '6000:5432'
    volumes:
      - scms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d postgres' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scms-postgres-data:
